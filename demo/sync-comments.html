<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>redline shared comments fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    #cta { padding: 10px 16px; background: #111; color: #fff; border: 0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Shared comments</h1>
  <p>Two browser contexts should see the same notes on this button.</p>
  <button id="cta" type="button">Primary CTA</button>
  <script type="module">
    import { init } from 'redline-inspect';
    window.__redline = init({
      startActive: false,
      sync: {
        endpoint: 'http://127.0.0.1:8787',
        project: 'e2e-demo',
        key: 'e2e-demo-key',
      },
    });
  </script>
</body>
</html>
